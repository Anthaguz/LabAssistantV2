      - { value: 0x04, name: attached-vm-list, title: List attached VMs }
      - { value: 0x05, name: create, title: Create switch }
      - { value: 0x06, name: update, title: Update switch }
      - { value: 0x07, name: delete, title: Delete switch }

  - value: 0x13
