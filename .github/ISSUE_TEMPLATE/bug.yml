name: Bug report
description: Report a defect or regression
labels: ["bug"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Provide clear, numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      options:
        - label: Criteria 1
        - label: Criteria 2
        - label: Criteria 3
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What is explicitly not included?
    validations:
      required: false
  - type: textarea
    id: test-plan
    attributes:
      label: Test Plan
      description: How will this be verified?
    validations:
      required: false
