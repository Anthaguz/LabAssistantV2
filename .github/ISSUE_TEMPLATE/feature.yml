name: Feature request
description: Propose a new feature or enhancement
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome do you want?
    validations:
      required: true
  - type: checkboxes
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      options:
        - label: Criteria 1
        - label: Criteria 2
        - label: Criteria 3
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: What is explicitly not included?
    validations:
      required: false
  - type: textarea
    id: test-plan
    attributes:
      label: Test Plan
      description: How will this be verified?
    validations:
      required: false
