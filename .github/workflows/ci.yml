name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore LabAssistant.sln
      - name: Build
        run: dotnet build LabAssistant.sln -c Release
      - name: Test
        run: dotnet test -c Release
