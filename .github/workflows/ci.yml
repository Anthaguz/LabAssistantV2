name: ci

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore LabAssistant.sln

      - name: Build
        run: dotnet build LabAssistant.sln -c Release --no-restore

      - name: Test
        run: dotnet test LabAssistant.sln -c Release --no-build --no-restore